<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPC_GO 排工標記導航盤</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100dvh; width: 100vw; overflow: hidden; position: relative; background: #121212; }

        /* 側邊欄配置：電腦版固定左側，手機版轉為頂部抽屜 */
        #sidebar { 
            width: 360px; 
            background: #ffffff; 
            border-right: 1px solid #ddd; 
            display: flex; 
            flex-direction: column; 
            padding: 12px; 
            gap: 8px; 
            z-index: 1001; 
            box-shadow: 2px 0 10px rgba(0,0,0,0.15);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #map { flex: 1; height: 100%; width: 100%; z-index: 1; }

        .header-box { display: flex; justify-content: space-between; align-items: center; }
        h3 { font-size: 16px; color: #1a1a1a; font-weight: 800; }
        .toggle-btn { display: none; background: #007bff; color: white; border: none; border-radius: 4px; padding: 6px 10px; font-size: 12px; font-weight: bold; }

        textarea { 
            width: 100%; 
            height: 110px; 
            padding: 8px; 
            font-size: 13px; 
            resize: none; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-family: monospace; 
            background: #f8fafc;
        }

        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        button { 
            width: 100%; 
            padding: 10px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px;
            touch-action: manipulation;
        }
        button:active { filter: brightness(0.9); }
        
        .copy-btn { background: #28a745; }
        .clear-btn { background: #6c757d; padding: 6px; font-size: 11px; font-weight: normal; }

        /* 巨擎導航路徑自訂設定框 */
        .settings-bar { font-size: 11px; color: #555; background: #eef2f6; padding: 6px; border-radius: 4px; display: flex; flex-direction: column; gap: 4px; }
        .settings-bar input { width: 100%; padding: 4px; font-size: 11px; border: 1px solid #ccc; border-radius: 3px; }

        #list { flex: 1; overflow-y: auto; border-top: 1px solid #eee; padding-top: 6px; -webkit-overflow-scrolling: touch; }
        .item { background: #f8fafc; padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 6px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .item:hover { background: #edf2f7; }
        .item-nav-btn { background: #ff9800; color: white; padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; font-weight: bold; }

        .hint { font-size: 11px; color: #666; line-height: 1.3; }
        .quick-stations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-top: 1px solid #eee; padding-top: 6px; }
        .quick-btn { background: #eef2f5; color: #333; font-size: 11px; padding: 6px 2px; border: 1px solid #d1d9e0; border-radius: 4px; font-weight: normal; }

        .permanent-label {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
            white-space: nowrap;
        }
        .road-text { color: #facc15; font-weight: normal; margin-left: 2px; }

        /* 手機直向環境優化 (RWD) */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                max-height: 82vh;
                border-right: none;
                border-bottom: 3px solid #007bff;
                border-radius: 0 0 14px 14px;
            }
            #sidebar.collapsed {
                transform: translateY(-90%);
                box-shadow: none;
            }
            #sidebar.collapsed .hide-on-collapse {
                display: none;
            }
            .toggle-btn { display: block; }
            textarea { height: 85px; }
        }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header-box">
        <h3>⚡ 台電排工標記導航盤</h3>
        <button class="toggle-btn" onclick="toggleSidebar()">展開/收合</button>
    </div>

    <div class="hint hide-on-collapse">支援大小寫混打、空格、S 區段延伸與路名反查</div>

    <textarea id="input" class="hide-on-collapse" placeholder="貼上今日案件（可直接含案號）：
g4353ae54
案件2 g4464bb88
大甲案件 g4464sa97
g3759aa7788"></textarea>

    <div class="settings-bar hide-on-collapse">
        <label>巨擎導航喚起路徑 (支援 Scheme 或 URL)：</label>
        <input id="navScheme" type="text" value="titan://nav" placeholder="例: titan://nav 或 http://localhost:3000" />
    </div>

    <div class="btn-group hide-on-collapse">
        <button onclick="renderMarkers(true)">在地圖上標記點位</button>
        <button class="copy-btn" onclick="copySortedList()">📋 一鍵複製案件（貼至巨擎導航）</button>
        <button class="clear-btn" onclick="clearAll()">清空重填</button>
    </div>

    <div class="quick-stations hide-on-collapse">
        <button class="quick-btn" onclick="locateBase(0)">龍井服務所</button>
        <button class="quick-btn" onclick="locateBase(1)">沙鹿服務所</button>
        <button class="quick-btn" onclick="locateBase(2)">南勢溪公園</button>
        <button class="quick-btn" onclick="locateBase(3)">萬興陸橋</button>
        <button class="quick-btn" onclick="locateBase(4)">中華向上陸橋</button>
        <button class="quick-btn" onclick="locateBase(5)">國三沙田交叉</button>
    </div>

    <div id="list" class="hide-on-collapse"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('collapsed');
    }

    const googleRoads = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['0', '1', '2', '3'],
        attribution: '&copy; Google Maps'
    });

    const googleHybrid = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['0', '1', '2', '3'],
        attribution: '&copy; Google Maps'
    });

    const map = L.map('map', {
        center: [24.2100, 120.5500],
        zoom: 12,
        zoomControl: false,
        layers: [googleRoads]
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.control.layers({ "Google 道路": googleRoads, "Google 衛星混合": googleHybrid }, null, { position: 'topright' }).addTo(map);

    // 常駐公務與午休點（純名稱標註）
    const baseLocations = [
        { name: "龍井服務所", lat: 24.19277, lng: 120.54595, color: "green", desc: "公務點" },
        { name: "沙鹿服務所", lat: 24.23078, lng: 120.56306, color: "green", desc: "公務點" },
        { name: "南勢溪公園", lat: 24.22550, lng: 120.56470, color: "orange", desc: "午休點" },
        { name: "萬興陸橋", lat: 24.17250, lng: 120.54220, color: "orange", desc: "午休點" },
        { name: "中華向上陸橋", lat: 24.21520, lng: 120.53680, color: "orange", desc: "午休點" },
        { name: "國三沙田交叉", lat: 24.16100, lng: 120.53850, color: "orange", desc: "停駐點" }
    ];

    const baseMarkers = [];
    baseLocations.forEach(loc => {
        const marker = L.marker([loc.lat, loc.lng], {
            icon: L.icon({
                iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${loc.color}.png`,
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            })
        }).addTo(map);

        marker.bindTooltip(`<b>${loc.name}</b>`, {
            permanent: true,
            direction: 'bottom',
            offset: [0, 8],
            className: 'permanent-label'
        });

        marker.bindPopup(`<b>【${loc.desc}】${loc.name}</b><br><a href="https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}" target="_blank">Google 導航</a>`);
        baseMarkers.push(marker);
    });

    let markersLayer = L.layerGroup().addTo(map);
    let parsedCases = [];

    function locateBase(index) {
        const target = baseLocations[index];
        map.flyTo([target.lat, target.lng], 16);
        baseMarkers[index].openPopup();
        if (window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.add('collapsed');
        }
    }

    async function fetchRoadName(lat, lng) {
        try {
            const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`;
            const resp = await fetch(url, { headers: { 'Accept-Language': 'zh-TW' } });
            if (!resp.ok) return '';
            const data = await resp.json();
            const addr = data.address || {};
            return addr.road || addr.street || addr.suburb || addr.neighbourhood || '';
        } catch (e) {
            return '';
        }
    }

    function twd97ToWGS84(x, y) {
        const a = 6378137.0, b = 6356752.314245;
        const lon0 = 121 * Math.PI / 180, k0 = 0.9999, dx = 250000;
        const e = Math.sqrt(1 - (b * b) / (a * a)), e2 = e * e / (1 - e * e);
        
        x = x - dx;
        const m = y / k0;
        const mu = m / (a * (1 - e * e / 4 - 3 * e * e * e * e / 64 - 5 * e * e * e * e * e * e / 256));
        const e1 = (1 - Math.sqrt(1 - e * e)) / (1 + Math.sqrt(1 - e * e));
        
        const j1 = 3 * e1 / 2 - 27 * e1 * e1 * e1 / 32;
        const j2 = 21 * e1 * e1 / 16 - 55 * e1 * e1 * e1 * e1 / 32;
        const j3 = 151 * e1 * e1 * e1 / 96;
        
        const fp = mu + j1 * Math.sin(2 * mu) + j2 * Math.sin(4 * mu) + j3 * Math.sin(6 * mu);
        const c1 = e2 * Math.cos(fp) * Math.cos(fp);
        const t1 = Math.tan(fp) * Math.tan(fp);
        const r1 = a * (1 - e * e) / Math.pow(1 - e * e * Math.sin(fp) * Math.sin(fp), 1.5);
        const n1 = a / Math.sqrt(1 - e * e * Math.sin(fp) * Math.sin(fp));
        const d = x / (n1 * k0);
        
        const lat = fp - (n1 * Math.tan(fp) / r1) * (d * d / 2 - (5 + 3 * t1 + 10 * c1 - 4 * c1 * c1 - 9 * e2) * d * d * d * d / 24);
        const lon = lon0 + (d - (1 + 2 * t1 + c1) * d * d * d / 6) / Math.cos(fp);
        
        return { lat: lat * 180 / Math.PI, lng: lon * 180 / Math.PI };
    }

    function parsePowerCoord(codeStr) {
        const cleaned = codeStr.replace(/\s+/g, '').toUpperCase();
        const match = cleaned.match(/^([A-HJ-Z])(\d{2})(\d{2})([A-Z])([A-Z])(\d{2}|\d{4})$/);
        if (!match) return null;

        const [_, zone, xMap, yMap, subX, subY, pt] = match;
        const originMap = {
            'A': [170000, 2750000], 'B': [250000, 2750000],
            'C': [170000, 2700000], 'D': [250000, 2700000],
            'E': [170000, 2650000], 'F': [250000, 2650000],
            'G': [170000, 2650000], 'H': [250000, 2600000]
        };

        const baseOrigin = originMap[zone] || [170000, 2650000];
        let twdX = baseOrigin[0] + parseInt(xMap, 10) * 800;
        let twdY = baseOrigin[1] + parseInt(yMap, 10) * 500;

        twdX += (subX.charCodeAt(0) - 65) * 100;
        twdY += (subY.charCodeAt(0) - 65) * 100;

        if (pt.length === 2) {
            twdX += parseInt(pt[0], 10) * 10;
            twdY += parseInt(pt[1], 10) * 10;
        } else if (pt.length === 4) {
            twdX += parseInt(pt.substring(0, 2), 10);
            twdY += parseInt(pt.substring(2, 4), 10);
        }

        return { ...twd97ToWGS84(twdX, twdY), standardCode: cleaned };
    }

    // 直接跳轉/喚起巨擎導航
    function launchTitanNav(title, code, lat, lng) {
        const baseScheme = document.getElementById('navScheme').value.trim() || 'titan://nav';
        const queryParams = `title=${encodeURIComponent(title)}&code=${encodeURIComponent(code)}&lat=${lat}&lng=${lng}`;
        
        let targetUrl = '';
        if (baseScheme.includes('?')) {
            targetUrl = `${baseScheme}&${queryParams}`;
        } else {
            targetUrl = `${baseScheme}?${queryParams}`;
        }

        // 嘗試跳轉呼叫
        window.location.href = targetUrl;
    }

    async function renderMarkers(autoCollapseOnMobile = false) {
        markersLayer.clearLayers();
        parsedCases = [];
        const listDiv = document.getElementById('list');
        listDiv.innerHTML = '';
        const lines = document.getElementById('input').value.trim().split('\n');
        const bounds = [];

        baseLocations.forEach(loc => bounds.push([loc.lat, loc.lng]));

        for (let index = 0; index < lines.length; index++) {
            let line = lines[index].trim();
            if (!line) continue;

            let title = `案件 ${index + 1}`;
            let lat = null, lng = null, standardCode = '';

            const parts = line.split(/\s+/);
            let payload = line;

            if (parts.length >= 2) {
                const testCoord = parsePowerCoord(parts[parts.length - 1]);
                if (testCoord || parts[parts.length - 1].includes(',')) {
                    payload = parts.pop();
                    title = parts.join(' ');
                }
            }

            const powerRes = parsePowerCoord(payload);
            if (powerRes) {
                lat = powerRes.lat;
                lng = powerRes.lng;
                standardCode = powerRes.standardCode;
            } else if (payload.includes(',')) {
                const [la, ln] = payload.split(',');
                lat = parseFloat(la);
                lng = parseFloat(ln);
                standardCode = `${lat.toFixed(5)},${lng.toFixed(5)}`;
            } else if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                lng = parseFloat(parts[0]);
                lat = parseFloat(parts[1]);
                standardCode = `${lat.toFixed(5)},${lng.toFixed(5)}`;
            }

            if (lat && lng && !isNaN(lat) && !isNaN(lng)) {
                bounds.push([lat, lng]);

                const caseItem = { title, code: standardCode, lat, lng };
                parsedCases.push(caseItem);

                const marker = L.marker([lat, lng]).addTo(markersLayer);

                marker.bindTooltip(`<b>${title}</b> <span class="road-text">(${standardCode})</span>`, {
                    permanent: true,
                    direction: 'top',
                    offset: [0, -10],
                    className: 'permanent-label'
                });

                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <div style="flex:1;">
                        <b>${title}</b><br>
                        <span style="color:#666;font-size:11px;">${standardCode}</span> 
                        <span id="road-item-${index}" style="color:#007bff;font-size:11px;"></span>
                    </div>
                    <button class="item-nav-btn" onclick="event.stopPropagation(); launchTitanNav('${title}', '${standardCode}', ${lat}, ${lng})">🚀 導航</button>
                `;
                item.onclick = () => {
                    map.flyTo([lat, lng], 17);
                    marker.openPopup();
                    if (window.innerWidth <= 768) {
                        document.getElementById('sidebar').classList.add('collapsed');
                    }
                };
                listDiv.appendChild(item);

                fetchRoadName(lat, lng).then(road => {
                    const roadLabel = road ? ` | ${road}` : '';
                    marker.setTooltipContent(`<b>${title}</b> <span class="road-text">${roadLabel}</span>`);
                    
                    const googleNavUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
                    marker.bindPopup(`
                        <b>${title}</b><br>
                        ${road ? `<b>路名: ${road}</b><br>` : ''}
                        圖號/座標: ${standardCode}<br>
                        WGS84: ${lat.toFixed(5)}, ${lng.toFixed(5)}<br><br>
                        <button onclick="launchTitanNav('${title}', '${standardCode}', ${lat}, ${lng})" style="background:#ff9800;padding:6px;border:none;border-radius:4px;color:white;font-weight:bold;cursor:pointer;width:100%;margin-bottom:6px;">🚀 開啟巨擎導航</button>
                        <a href="${googleNavUrl}" target="_blank" style="color:#007bff;font-size:12px;text-decoration:none;">開啟 Google 導航</a>
                    `);

                    const itemRoadSpan = document.getElementById(`road-item-${index}`);
                    if (itemRoadSpan && road) itemRoadSpan.innerText = `(${road})`;
                });
            }
        }

        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [40, 40] });
        }

        if (autoCollapseOnMobile && window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.add('collapsed');
        }
    }

    // 一鍵複製排好的圖號座標
    function copySortedList() {
        if (parsedCases.length === 0) {
            alert("目前尚無標記的案件，請先輸入並標記！");
            return;
        }

        const textToCopy = parsedCases.map(c => `${c.title} ${c.code}`).join('\n');

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert(`已複製 ${parsedCases.length} 筆案件！可直接貼入巨擎導航。`);
            }).catch(() => fallbackCopy(textToCopy));
        } else {
            fallbackCopy(textToCopy);
        }
    }

    function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
            document.execCommand('copy');
            alert(`已複製 ${parsedCases.length} 筆案件！可直接貼入巨擎導航。`);
        } catch (err) {
            alert('複製失敗，請手動選取複製');
        }
        document.body.removeChild(ta);
    }

    function clearAll() {
        markersLayer.clearLayers();
        parsedCases = [];
        document.getElementById('input').value = '';
        document.getElementById('list').innerHTML = '';
        map.setView([24.2100, 120.5500], 12);
    }
</script>
</body>
</html>
