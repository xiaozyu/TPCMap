<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>⚡ 台電工單導航盤</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background: #0f172a;
      color: #f8fafc;
      padding-bottom: 60px;
    }
    h3 { margin: 0 0 10px 0; font-size: 1.15rem; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }

    /* 頂部操作按鈕 */
    .top-action-bar { display: flex; gap: 8px; margin-bottom: 8px; }
    .btn-paste {
      flex: 3;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-clear {
      flex: 1;
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* 同步至註記卡片 */
    .sync-card {
      background: #1e293b;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .btn-copy-diary {
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 當前焦點工單視窗 */
    .focus-card {
      background: #1e293b;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      margin-bottom: 12px;
    }
    .focus-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .focus-title { font-size: 1.35rem; font-weight: bold; font-family: monospace; color: #facc15; }
    .focus-note { font-size: 0.9rem; color: #cbd5e1; }

    .pager-bar { display: flex; gap: 8px; margin-bottom: 8px; }
    .pager-btn {
      flex: 1;
      background: #475569;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .pager-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .nav-actions { display: flex; gap: 8px; margin-bottom: 8px; }
    .nav-btn {
      flex: 2;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
    }
    .view-btn {
      flex: 1;
      background: #334155;
      color: #f8fafc;
      border: 1px solid #64748b;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .coords-info { font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; }

    .map-wrapper {
      width: 100%;
      height: 250px;
      border-radius: 6px;
      overflow: hidden;
      background: #020617;
      border: 1px solid #475569;
    }
    iframe { width: 100%; height: 100%; border: none; }

    /* 工單清單樣式 */
    .section-title { font-size: 0.95rem; font-weight: bold; color: #94a3b8; margin: 16px 0 8px 0; }
    .task-item {
      background: #1e293b;
      padding: 10px 12px;
      border-radius: 6px;
      border-left: 5px solid #64748b;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .task-item.active { border-left-color: #38bdf8; background: #334155; }
    .task-item.done { opacity: 0.45; text-decoration: line-through; }
    .item-left { display: flex; flex-direction: column; gap: 2px; }
    .item-code { font-family: monospace; font-weight: bold; font-size: 1.1rem; color: #facc15; }
    .item-note { font-size: 0.85rem; color: #cbd5e1; }
    .small-btn {
      background: none;
      border: 1px solid #64748b;
      color: #94a3b8;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h3>
    <span>⚡ 台電工單導航盤</span>
    <span id="today-date-text" style="font-size:0.85rem; color:#94a3b8;"></span>
  </h3>

  <!-- 頂部按鈕 -->
  <div class="top-action-bar">
    <button id="btn-paste-clip" class="btn-paste">📋 自動貼上圈選文字並匯入</button>
    <button id="btn-clear-today" class="btn-clear">清空</button>
  </div>

  <!-- 一鍵複製成日記格式 -->
  <div class="sync-card">
    <button id="btn-copy-diary" class="btn-copy-diary">📝 一鍵複製今日案件（可貼入日曆註記）</button>
  </div>

  <!-- 當前導航視窗 -->
  <div class="focus-card" id="focus-panel" style="display:none;">
    <div class="focus-header">
      <div>
        <span id="focus-index" style="color:#38bdf8;font-weight:bold;margin-right:6px;">#1</span>
        <span id="focus-code" class="focus-title"></span>
      </div>
      <span id="focus-note" class="focus-note"></span>
    </div>

    <div class="pager-bar">
      <button id="prev-btn" class="pager-btn">◀ 上一件</button>
      <button id="next-btn" class="pager-btn">下一件 ▶</button>
    </div>

    <div class="nav-actions">
      <a id="nav-btn" class="nav-btn" target="_blank">🚗 開始導航</a>
      <button id="toggle-view-btn" class="view-btn">切換街景</button>
    </div>

    <div id="coords-text" class="coords-info"></div>

    <div class="map-wrapper">
      <iframe id="map-frame" src="about:blank"></iframe>
    </div>
  </div>

  <!-- 工單列表 -->
  <div class="section-title">📋 今日工單（點擊切換預覽）</div>
  <div id="task-list"></div>

  <script>
    const BASE_COORDS = {
      'A': [90000, 2750000],  'B': [170000, 2750000], 'C': [250000, 2750000],
      'D': [90000, 2700000],  'E': [170000, 2700000], 'F': [250000, 2700000],
      'G': [170000, 2650000], 'H': [250000, 2650000],
      'J': [90000, 2600000],  'K': [170000, 2600000], 'L': [250000, 2600000],
      'M': [90000, 2550000],  'N': [170000, 2550000], 'O': [250000, 2550000],
      'P': [90000, 2500000],  'Q': [170000, 2500000], 'R': [250000, 2500000],
      'T': [170000, 2450000], 'U': [250000, 2450000],
      'V': [170000, 2400000], 'W': [250000, 2400000]
    };

    const TO_DIGIT = { 'O': '0', 'I': '1', 'L': '1', 'Z': '2', 'A': '4', 'S': '5', 'G': '6', 'B': '8', 'Q': '0', 'D': '0' };
    const TO_LETTER = { '0': 'O', '1': 'I', '8': 'B', '5': 'S', '2': 'Z' };

    function sanitizeTaipowerCode(raw) {
      let s = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (s.length < 9) return raw;
      let arr = s.split('');
      if (TO_LETTER[arr[0]]) arr[0] = TO_LETTER[arr[0]];
      for (let i = 1; i <= 4; i++) if (TO_DIGIT[arr[i]]) arr[i] = TO_DIGIT[arr[i]];
      for (let i = 5; i <= 6; i++) if (TO_LETTER[arr[i]]) arr[i] = TO_LETTER[arr[i]];
      for (let i = 7; i < arr.length; i++) if (TO_DIGIT[arr[i]]) arr[i] = TO_DIGIT[arr[i]];
      return arr.join('');
    }

    function taipowerToTWD67(code) {
      code = sanitizeTaipowerCode(code);
      if (code.length < 9) return null;
      const zone = code[0];
      if (!BASE_COORDS[zone]) return null;
      const [baseX, baseY] = BASE_COORDS[zone];

      const x_800 = parseInt(code.substring(1, 3), 10);
      const y_500 = parseInt(code.substring(3, 5), 10);
      const subX = code[5].charCodeAt(0) - 65;
      const subY = code[6].charCodeAt(0) - 65;

      let offsetX = 0, offsetY = 0;
      if (code.length >= 11) {
        offsetX = parseInt(code.substring(7, 9), 10);
        offsetY = parseInt(code.substring(9, 11), 10);
      } else if (code.length >= 9) {
        offsetX = parseInt(code[7], 10) * 10;
        offsetY = parseInt(code[8], 10) * 10;
      }
      return [baseX + (x_800 * 800) + (subX * 100) + offsetX, baseY + (y_500 * 500) + (subY * 100) + offsetY];
    }

    function twd67ToWGS84(x, y) {
      const A = 0.00001549, B = 0.000006521;
      const x97 = x + 807.8 + A * x + B * y;
      const y97 = y - 248.6 + A * y - B * x;

      const a = 6378137.0, b = 6356752.314245, lon0 = 121.0 * Math.PI / 180, k0 = 0.9999, dx = 250000;
      const e = Math.sqrt(1 - (b * b) / (a * a)), e2 = (e * e) / (1 - e * e);
      const M = y97 / k0;
      const mu = M / (a * (1 - e*e/4 - 3*e*e*e*e/64 - 5*e*e*e*e*e*e/256));
      const e1 = (1 - Math.sqrt(1 - e*e)) / (1 + Math.sqrt(1 - e*e));

      const fp = mu + (3*e1/2 - 27*e1*e1*e1/32)*Math.sin(2*mu) + (21*e1*e1/16 - 55*e1*e1*e1*e1/32)*Math.sin(4*mu) + (151*e1*e1*e1/96)*Math.sin(6*mu);
      const C1 = e2 * Math.pow(Math.cos(fp), 2);
      const T1 = Math.pow(Math.tan(fp), 2);
      const R1 = a * (1 - e*e) / Math.pow(1 - e*e * Math.sin(fp)*Math.sin(fp), 1.5);
      const N1 = a / Math.sqrt(1 - e*e * Math.sin(fp)*Math.sin(fp));
      const D = (x97 - dx) / (N1 * k0);

      const latRad = fp - (N1 * Math.tan(fp) / R1) * ((D*D/2) - (5 + 3*T1 + 10*C1 - 4*C1*C1 - 9*e2)*Math.pow(D,4)/24 + (61 + 90*T1 + 298*C1 + 45*T1*T1 - 252*e2 - 3*C1*C1)*Math.pow(D,6)/720);
      const lonRad = lon0 + (D - (1 + 2*T1 + C1)*Math.pow(D,3)/6 + (5 - 2*C1 + 28*T1 - 3*C1*C1 + 8*e2 + 24*T1*T1)*Math.pow(D,5)/120) / Math.cos(fp);

      return { lat: (latRad * 180 / Math.PI).toFixed(6), lng: (lonRad * 180 / Math.PI).toFixed(6) };
    }

    let tasks = JSON.parse(localStorage.getItem('tpc_tasks') || '[]');
    let currentIndex = 0;
    let isStreetView = false;

    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('today-date-text').innerText = todayStr;

    const btnPasteClip = document.getElementById('btn-paste-clip');
    const btnClearToday = document.getElementById('btn-clear-today');
    const btnCopyDiary = document.getElementById('btn-copy-diary');

    const focusPanel = document.getElementById('focus-panel');
    const focusIndex = document.getElementById('focus-index');
    const focusCode = document.getElementById('focus-code');
    const focusNote = document.getElementById('focus-note');
    const navBtn = document.getElementById('nav-btn');
    const toggleViewBtn = document.getElementById('toggle-view-btn');
    const mapFrame = document.getElementById('map-frame');
    const coordsText = document.getElementById('coords-text');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const taskList = document.getElementById('task-list');

    function saveTasks() {
      localStorage.setItem('tpc_tasks', JSON.stringify(tasks));
    }

    const COORD_REGEX = /([A-HJ-NP-W][0-9]{4}\s*[A-H][A-E]\s*(?:[0-9]{4}|[0-9]{2}))/gi;

    function parseText(content) {
      if (!content.trim()) return;
      const lines = content.split(/[\r\n]+/);
      let count = 0;

      lines.forEach(line => {
        const matches = line.match(COORD_REGEX);
        if (matches) {
          matches.forEach(m => {
            const cleanCode = sanitizeTaipowerCode(m.replace(/\s+/g, ''));
            let note = line.replace(m, '')
                           .replace(/施工地點|當日預計施工地點|共\d+筆|每頁\d+|目前在第\d+頁/g, '')
                           .replace(/[\s,]+/g, ' ')
                           .trim();

            if (!tasks.some(t => t.code === cleanCode)) {
              tasks.push({ code: cleanCode, note: note || '施工點', done: false });
              count++;
            }
          });
        }
      });

      if (count > 0) {
        saveTasks();
        renderTasks();
        selectTask(tasks.length - count);
      } else {
        alert("未在剪貼簿中找到台電圖號，請重新複製！");
      }
    }

    btnPasteClip.onclick = async () => {
      try {
        const text = await navigator.clipboard.readText();
        parseText(text);
      } catch (err) {
        const manual = prompt("請貼上複製的文字：");
        if (manual) parseText(manual);
      }
    };

    btnClearToday.onclick = () => {
      if (confirm('確定清空今天的工單列表？')) {
        tasks = [];
        saveTasks();
        renderTasks();
      }
    };

    // 一鍵生成日記文字並複製到剪貼簿
    btnCopyDiary.onclick = async () => {
      if (tasks.length === 0) {
        alert("目前沒有工單可以複製！");
        return;
      }

      const diaryText = tasks.map((t, idx) => {
        return `${idx + 1}. ${t.code} (${t.note || '無備註'})`;
      }).join('\n');

      try {
        await navigator.clipboard.writeText(diaryText);
        alert(`已複製今日 ${tasks.length} 筆案件！請直接前往日曆貼到「註記」欄位。`);
      } catch (err) {
        prompt("請手動複製以下日記文字：", diaryText);
      }
    };

    function renderTasks() {
      taskList.innerHTML = '';
      if (tasks.length === 0) {
        focusPanel.style.display = 'none';
        taskList.innerHTML = '<div style="color:#64748b;font-size:0.9rem;padding:8px;">尚無案件，請圈選複製報工文字後點上方按鈕匯入。</div>';
        return;
      }

      tasks.forEach((t, idx) => {
        const item = document.createElement('div');
        item.className = `task-item ${idx === currentIndex ? 'active' : ''} ${t.done ? 'done' : ''}`;
        item.onclick = (e) => {
          if (e.target.tagName === 'BUTTON') return;
          selectTask(idx);
        };

        item.innerHTML = `
          <div class="item-left">
            <div>
              <span style="color:#38bdf8;font-weight:bold;margin-right:6px;">#${idx + 1}</span>
              <span class="item-code">${t.code}</span>
            </div>
            <span class="item-note">${t.note}</span>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="small-btn" onclick="toggleDone(${idx})">${t.done ? '復原' : '完工'}</button>
            <button class="small-btn" style="color:#ef4444;" onclick="deleteTask(${idx})">刪除</button>
          </div>
        `;
        taskList.appendChild(item);
      });

      selectTask(currentIndex);
    }

    function selectTask(idx) {
      if (idx < 0 || idx >= tasks.length) return;
      currentIndex = idx;
      const t = tasks[currentIndex];

      focusPanel.style.display = 'block';
      focusIndex.innerText = `#${currentIndex + 1}`;
      focusCode.innerText = t.code;
      focusNote.innerText = t.note || '';

      prevBtn.disabled = (currentIndex === 0);
      nextBtn.disabled = (currentIndex === tasks.length - 1);

      const twd67 = taipowerToTWD67(t.code);
      if (twd67) {
        const wgs = twd67ToWGS84(twd67[0], twd67[1]);
        coordsText.innerText = `WGS84 座標: ${wgs.lat}, ${wgs.lng}`;
        navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${wgs.lat},${wgs.lng}`;
        updateMap(wgs.lat, wgs.lng);
      }

      document.querySelectorAll('.task-item').forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
      });
    }

    function updateMap(lat, lng) {
      if (isStreetView) {
        mapFrame.src = `https://maps.google.com/maps?q=&layer=c&cbll=${lat},${lng}&cbp=11,0,0,0,0&output=svembed`;
      } else {
        mapFrame.src = `https://maps.google.com/maps?q=${lat},${lng}&hl=zh-TW&z=18&output=embed`;
      }
    }

    prevBtn.onclick = () => { if (currentIndex > 0) selectTask(currentIndex - 1); };
    nextBtn.onclick = () => { if (currentIndex < tasks.length - 1) selectTask(currentIndex + 1); };

    toggleViewBtn.onclick = () => {
      isStreetView = !isStreetView;
      toggleViewBtn.innerText = isStreetView ? "切換地圖" : "切換街景";
      const t = tasks[currentIndex];
      if (t) {
        const twd67 = taipowerToTWD67(t.code);
        if (twd67) {
          const wgs = twd67ToWGS84(twd67[0], twd67[1]);
          updateMap(wgs.lat, wgs.lng);
        }
      }
    };

    window.toggleDone = (idx) => {
      tasks[idx].done = !tasks[idx].done;
      saveTasks();
      renderTasks();
    };

    window.deleteTask = (idx) => {
      tasks.splice(idx, 1);
      if (currentIndex >= tasks.length) currentIndex = Math.max(0, tasks.length - 1);
      saveTasks();
      renderTasks();
    };

    renderTasks();
  </script>
</body>
</html>
