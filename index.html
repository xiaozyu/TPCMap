<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>⚡ 台電圖號・點擊辨識導航</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 10px; background: #0f172a; color: #f8fafc; }
    h3 { margin: 0 0 8px 0; font-size: 1.1rem; }
    .upload-card { background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
    input[type="file"] { width: 100%; color: #94a3b8; font-size: 0.9rem; }
    #status { margin-top: 6px; font-weight: bold; font-size: 0.95rem; color: #38bdf8; }

    /* 圖片視窗容器 */
    .viewport {
      position: relative;
      width: 100%;
      height: 380px;
      background: #020617;
      border-radius: 8px;
      overflow: hidden;
      display: none;
      touch-action: none;
      border: 1px solid #334155;
    }
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }
    #display-img { display: block; pointer-events: none; }

    /* 點擊標記紅圈 */
    #tap-indicator {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 3px solid #ef4444;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      z-index: 10;
    }

    /* 預覽與導航面板 */
    #preview-container {
      display: none;
      margin-top: 10px;
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .top-action-bar { display: flex; gap: 8px; margin-bottom: 8px; }
    .nav-btn {
      flex: 1;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1.05rem;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .view-toggle-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #64748b;
      padding: 0 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .target-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      color: #facc15;
      font-size: 1.25rem;
      font-family: monospace;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 4px;
    }
    .coords-text { font-size: 0.85rem; color: #94a3b8; margin: 4px 0 8px 0; }
    .map-frame-wrapper {
      width: 100%;
      height: 280px;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      border: 1px solid #475569;
    }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <h3>⚡ 台電圖號・點擊辨識預覽導航</h3>

  <div class="upload-card">
    <input type="file" id="file-input" accept="image/*">
    <div id="status">請上傳報工畫面截圖</div>
  </div>

  <div class="viewport" id="viewport">
    <div id="stage">
      <img id="display-img">
      <div id="tap-indicator"></div>
    </div>
  </div>

  <div id="preview-container">
    <div class="top-action-bar">
      <a id="nav-btn" class="nav-btn" target="_blank">🚗 開始導航</a>
      <button id="toggle-view-btn" class="view-toggle-btn">切換街景</button>
    </div>
    <input type="text" id="target-input" class="target-input">
    <div id="coords-text" class="coords-text">定位中...</div>
    <div class="map-frame-wrapper">
      <iframe id="map-frame" src="about:blank"></iframe>
    </div>
  </div>

  <script>
    const BASE_COORDS = {
      'A': [90000, 2750000],  'B': [170000, 2750000], 'C': [250000, 2750000],
      'D': [90000, 2700000],  'E': [170000, 2700000], 'F': [250000, 2700000],
      'G': [170000, 2650000], 'H': [250000, 2650000],
      'J': [90000, 2600000],  'K': [170000, 2600000], 'L': [250000, 2600000],
      'M': [90000, 2550000],  'N': [170000, 2550000], 'O': [250000, 2550000],
      'P': [90000, 2500000],  'Q': [170000, 2500000], 'R': [250000, 2500000],
      'T': [170000, 2450000], 'U': [250000, 2450000],
      'V': [170000, 2400000], 'W': [250000, 2400000]
    };

    // 智能糾錯常數表
    const TO_DIGIT = { 'O': '0', 'I': '1', 'L': '1', 'Z': '2', 'A': '4', 'S': '5', 'G': '6', 'B': '8', 'Q': '0', 'D': '0' };
    const TO_LETTER = { '0': 'O', '1': 'I', '8': 'B', '5': 'S', '2': 'Z' };

    // 台電圖號強制型態糾錯 (例: G3850HES330 -> G3850HE5330)
    function sanitizeTaipowerCode(raw) {
      let s = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (s.length < 9) return raw;

      let arr = s.split('');

      // 第 0 碼：大分區 (字母)
      if (TO_LETTER[arr[0]]) arr[0] = TO_LETTER[arr[0]];

      // 第 1~4 碼：800m/500m (數字)
      for (let i = 1; i <= 4; i++) {
        if (TO_DIGIT[arr[i]]) arr[i] = TO_DIGIT[arr[i]];
      }

      // 第 5~6 碼：子圖廓 (字母 A~H, A~E)
      for (let i = 5; i <= 6; i++) {
        if (TO_LETTER[arr[i]]) arr[i] = TO_LETTER[arr[i]];
      }

      // 第 7 碼之後：偏移量 (數字)
      for (let i = 7; i < arr.length; i++) {
        if (TO_DIGIT[arr[i]]) arr[i] = TO_DIGIT[arr[i]];
      }

      return arr.join('');
    }

    function taipowerToTWD67(code) {
      code = sanitizeTaipowerCode(code);
      if (code.length < 9) return null;
      const zone = code[0];
      if (!BASE_COORDS[zone]) return null;
      const [baseX, baseY] = BASE_COORDS[zone];

      const x_800 = parseInt(code.substring(1, 3), 10);
      const y_500 = parseInt(code.substring(3, 5), 10);
      const subX = code[5].charCodeAt(0) - 65;
      const subY = code[6].charCodeAt(0) - 65;

      let offsetX = 0, offsetY = 0;
      if (code.length >= 11) {
        offsetX = parseInt(code.substring(7, 9), 10);
        offsetY = parseInt(code.substring(9, 11), 10);
      } else if (code.length >= 9) {
        offsetX = parseInt(code[7], 10) * 10;
        offsetY = parseInt(code[8], 10) * 10;
      }

      if (isNaN(offsetX) || isNaN(offsetY) || isNaN(x_800) || isNaN(y_500)) return null;
      return [baseX + (x_800 * 800) + (subX * 100) + offsetX, baseY + (y_500 * 500) + (subY * 100) + offsetY];
    }

    function twd67ToWGS84(x, y) {
      const A = 0.00001549, B = 0.000006521;
      const x97 = x + 807.8 + A * x + B * y;
      const y97 = y - 248.6 + A * y - B * x;

      const a = 6378137.0, b = 6356752.314245, lon0 = 121.0 * Math.PI / 180, k0 = 0.9999, dx = 250000;
      const e = Math.sqrt(1 - (b * b) / (a * a)), e2 = (e * e) / (1 - e * e);
      const M = y97 / k0;
      const mu = M / (a * (1 - e*e/4 - 3*e*e*e*e/64 - 5*e*e*e*e*e*e/256));
      const e1 = (1 - Math.sqrt(1 - e*e)) / (1 + Math.sqrt(1 - e*e));

      const fp = mu + (3*e1/2 - 27*e1*e1*e1/32)*Math.sin(2*mu) + (21*e1*e1/16 - 55*e1*e1*e1*e1/32)*Math.sin(4*mu) + (151*e1*e1*e1/96)*Math.sin(6*mu);
      const C1 = e2 * Math.pow(Math.cos(fp), 2);
      const T1 = Math.pow(Math.tan(fp), 2);
      const R1 = a * (1 - e*e) / Math.pow(1 - e*e * Math.sin(fp)*Math.sin(fp), 1.5);
      const N1 = a / Math.sqrt(1 - e*e * Math.sin(fp)*Math.sin(fp));
      const D = (x97 - dx) / (N1 * k0);

      const latRad = fp - (N1 * Math.tan(fp) / R1) * ((D*D/2) - (5 + 3*T1 + 10*C1 - 4*C1*C1 - 9*e2)*Math.pow(D,4)/24 + (61 + 90*T1 + 298*C1 + 45*T1*T1 - 252*e2 - 3*C1*C1)*Math.pow(D,6)/720);
      const lonRad = lon0 + (D - (1 + 2*T1 + C1)*Math.pow(D,3)/6 + (5 - 2*C1 + 28*T1 - 3*C1*C1 + 8*e2 + 24*T1*T1)*Math.pow(D,5)/120) / Math.cos(fp);

      return { lat: (latRad * 180 / Math.PI).toFixed(6), lng: (lonRad * 180 / Math.PI).toFixed(6) };
    }

    let worker = null;
    async function initOCR() {
      worker = await Tesseract.createWorker(['eng']);
      await worker.setParameters({
        tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz '
      });
    }
    initOCR();

    const fileInput = document.getElementById('file-input');
    const statusText = document.getElementById('status');
    const viewport = document.getElementById('viewport');
    const stage = document.getElementById('stage');
    const displayImg = document.getElementById('display-img');
    const tapIndicator = document.getElementById('tap-indicator');

    const previewContainer = document.getElementById('preview-container');
    const targetInput = document.getElementById('target-input');
    const navBtn = document.getElementById('nav-btn');
    const coordsText = document.getElementById('coords-text');
    const mapFrame = document.getElementById('map-frame');
    const toggleViewBtn = document.getElementById('toggle-view-btn');

    let scale = 1, panX = 0, panY = 0;
    let currentLat = null, currentLng = null;
    let isStreetView = false;

    function updateTransform() {
      stage.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      statusText.innerText = "載入圖片中...";
      previewContainer.style.display = 'none';

      const url = URL.createObjectURL(file);
      displayImg.src = url;

      displayImg.onload = () => {
        viewport.style.display = 'block';
        scale = viewport.clientWidth / displayImg.naturalWidth;
        panX = 0;
        panY = 0;
        updateTransform();
        statusText.innerText = "👉 雙指放大移動，手指「直接點擊圖號」秒辨識！";
      };
    });

    // 觸控手勢：單指滑動移動 / 雙指縮放 / 輕點觸發辨識
    let isTouching = false;
    let touchMoved = false;
    let startTouches = [];
    let startPanX = 0, startPanY = 0, startScale = 1;

    viewport.addEventListener('touchstart', (e) => {
      isTouching = true;
      touchMoved = false;
      if (e.touches.length === 2) {
        startTouches = [e.touches[0], e.touches[1]];
        startScale = scale;
        startPanX = panX;
        startPanY = panY;
      } else if (e.touches.length === 1) {
        startTouches = [e.touches[0]];
        startPanX = panX;
        startPanY = panY;
      }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
      if (!isTouching) return;
      e.preventDefault();
      touchMoved = true;

      if (e.touches.length === 2) {
        const d1 = Math.hypot(startTouches[0].clientX - startTouches[1].clientX, startTouches[0].clientY - startTouches[1].clientY);
        const d2 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        scale = Math.min(Math.max(startScale * (d2 / d1), 0.2), 6.0);
        updateTransform();
      } else if (e.touches.length === 1) {
        panX = startPanX + (e.touches[0].clientX - startTouches[0].clientX);
        panY = startPanY + (e.touches[0].clientY - startTouches[0].clientY);
        updateTransform();
      }
    }, { passive: false });

    viewport.addEventListener('touchend', async (e) => {
      if (!isTouching) return;
      isTouching = false;

      // 如果只是點一下（沒有滑動），就觸發點擊定位辨識
      if (!touchMoved && e.changedTouches.length === 1) {
        const t = e.changedTouches[0];
        const vRect = viewport.getBoundingClientRect();
        const imgX = (t.clientX - vRect.left - panX) / scale;
        const imgY = (t.clientY - vRect.top - panY) / scale;

        // 標記紅圈位置
        tapIndicator.style.left = imgX + 'px';
        tapIndicator.style.top = imgY + 'px';
        tapIndicator.style.display = 'block';

        statusText.innerText = "⚡ 正在鎖定點位辨識中...";
        await recognizeAtPoint(imgX, imgY);
      }
    });

    // 以點擊點為中心，自動切出橫向文字區塊
    async function recognizeAtPoint(cx, cy) {
      // 橫向抓取 360px、縱向 70px（完美涵蓋一個台電圖號高度與長度）
      const sw = 380;
      const sh = 80;
      const sx = Math.max(0, cx - (sw * 0.35)); // 往右偏抓整行
      const sy = Math.max(0, cy - (sh / 2));

      const cropCanvas = document.createElement('canvas');
      cropCanvas.width = sw * 1.5;
      cropCanvas.height = sh * 1.5;
      const ctx = cropCanvas.getContext('2d');

      ctx.drawImage(displayImg, sx, sy, sw, sh, 0, 0, cropCanvas.width, cropCanvas.height);

      // 自動對比化強化
      const imgData = ctx.getImageData(0, 0, cropCanvas.width, cropCanvas.height);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        const v = gray > 135 ? 255 : 0;
        d[i] = d[i+1] = d[i+2] = v;
      }
      ctx.putImageData(imgData, 0, 0);

      const ret = await worker.recognize(cropCanvas);
      let raw = ret.data.text.replace(/\s+/g, '').toUpperCase();

      // 先抓出類似圖號的子字串
      const match = raw.match(/[A-Z0-9]{9,11}/);
      let candidate = match ? match[0] : raw;

      // 執行核心智能糾錯 (修正 S->5, O->0 等)
      const fixedCode = sanitizeTaipowerCode(candidate);

      targetInput.value = fixedCode;
      statusText.innerText = "✅ 辨識完成！下方可確認經緯度與街景";
      processTarget(fixedCode);
      previewContainer.style.display = 'block';
    }

    function processTarget(val) {
      isStreetView = false;
      toggleViewBtn.innerText = "切換街景";

      const twd67 = taipowerToTWD67(val);
      if (twd67) {
        const wgs = twd67ToWGS84(twd67[0], twd67[1]);
        currentLat = wgs.lat;
        currentLng = wgs.lng;
        coordsText.innerText = `WGS84 經緯度: ${currentLat}, ${currentLng}`;
        navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${currentLat},${currentLng}`;
        updateMapFrame();
      } else {
        currentLat = null;
        currentLng = null;
        coordsText.innerText = `❌ 圖號解析失敗，請手動確認`;
        mapFrame.src = "about:blank";
      }
    }

    function updateMapFrame() {
      if (!currentLat || !currentLng) return;
      if (isStreetView) {
        mapFrame.src = `https://maps.google.com/maps?q=&layer=c&cbll=${currentLat},${currentLng}&cbp=11,0,0,0,0&output=svembed`;
      } else {
        mapFrame.src = `https://maps.google.com/maps?q=${currentLat},${currentLng}&hl=zh-TW&z=18&output=embed`;
      }
    }

    toggleViewBtn.addEventListener('click', () => {
      if (!currentLat || !currentLng) return;
      isStreetView = !isStreetView;
      toggleViewBtn.innerText = isStreetView ? "切換地圖" : "切換街景";
      updateMapFrame();
    });

    targetInput.addEventListener('change', (e) => {
      processTarget(e.target.value);
    });
  </script>
</body>
</html>
