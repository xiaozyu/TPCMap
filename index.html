<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>⚡ 台電圖號・手動框選快速導航</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; touch-action: pan-y; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; background: #0f172a; color: #f8fafc; }
    h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
    .upload-card { background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    input[type="file"] { width: 100%; color: #94a3b8; font-size: 0.9rem; }
    #status { margin-top: 6px; font-weight: bold; font-size: 0.95rem; color: #38bdf8; }

    /* 圖片手動框選容器 */
    .img-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: none;
      touch-action: none; /* 禁用預設滑動以支援手指拉框 */
      user-select: none;
    }
    #display-img { display: block; width: 100%; height: auto; pointer-events: none; }
    
    /* 拖曳選擇框 */
    #select-box {
      position: absolute;
      border: 2px dashed #38bdf8;
      background: rgba(56, 189, 248, 0.25);
      display: none;
      pointer-events: none;
    }

    /* 浮動導航結果面板 */
    #result-panel {
      display: none;
      margin-top: 10px;
      background: #1e293b;
      padding: 12px;
      border-radius: 8px;
      border-left: 5px solid #22c55e;
    }
    .panel-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .coord-val { font-family: monospace; font-size: 1.3rem; font-weight: bold; color: #facc15; }
    .nav-btn {
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      display: inline-block;
      white-space: nowrap;
    }
    .geo-text { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
  </style>
</head>
<body>

  <h3>⚡ 台電圖號・手指框選秒辨識</h3>

  <div class="upload-card">
    <input type="file" id="file-input" accept="image/*">
    <div id="status">請上傳報工畫面截圖</div>
  </div>

  <!-- 圖片手動拉框區 -->
  <div class="img-wrapper" id="img-container">
    <img id="display-img" alt="派工截圖">
    <div id="select-box"></div>
  </div>

  <!-- 辨識與導航面板 -->
  <div id="result-panel">
    <div class="panel-row">
      <div>
        <div style="font-size: 0.8rem; color: #94a3b8;">辨識圖號 (可直接點擊修改)：</div>
        <input type="text" id="coord-input" style="font-size:1.2rem; font-family:monospace; font-weight:bold; background:#0f172a; color:#fff; border:1px solid #475569; padding:4px 8px; border-radius:4px; width:150px;">
      </div>
      <a id="nav-action-btn" class="nav-btn" target="_blank">🚗 導航</a>
    </div>
    <div class="geo-text" id="geo-info"></div>
  </div>

  <script>
    // 1. TWD67 基準點定義
    const BASE_COORDS = {
      'A': [90000, 2750000],  'B': [170000, 2750000], 'C': [250000, 2750000],
      'D': [90000, 2700000],  'E': [170000, 2700000], 'F': [250000, 2700000],
      'G': [170000, 2650000], 'H': [250000, 2650000],
      'J': [90000, 2600000],  'K': [170000, 2600000], 'L': [250000, 2600000],
      'M': [90000, 2550000],  'N': [170000, 2550000], 'O': [250000, 2550000],
      'P': [90000, 2500000],  'Q': [170000, 2500000], 'R': [250000, 2500000],
      'T': [170000, 2450000], 'U': [250000, 2450000],
      'V': [170000, 2400000], 'W': [250000, 2400000]
    };

    function taipowerToTWD67(code) {
      code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code.length < 9) return null;
      const zone = code[0];
      if (!BASE_COORDS[zone]) return null;
      const [baseX, baseY] = BASE_COORDS[zone];

      const x_800 = parseInt(code.substring(1, 3), 10);
      const y_500 = parseInt(code.substring(3, 5), 10);
      const subX = code[5].charCodeAt(0) - 65;
      const subY = code[6].charCodeAt(0) - 65;

      let offsetX = 0, offsetY = 0;
      if (code.length >= 11) {
        offsetX = parseInt(code.substring(7, 9), 10);
        offsetY = parseInt(code.substring(9, 11), 10);
      } else if (code.length >= 9) {
        offsetX = parseInt(code[7], 10) * 10;
        offsetY = parseInt(code[8], 10) * 10;
      }
      return [baseX + (x_800 * 800) + (subX * 100) + offsetX, baseY + (y_500 * 500) + (subY * 100) + offsetY];
    }

    function twd67ToWGS84(x, y) {
      const A = 0.00001549, B = 0.000006521;
      const x97 = x + 807.8 + A * x + B * y;
      const y97 = y - 248.6 + A * y - B * x;

      const a = 6378137.0, b = 6356752.314245, lon0 = 121.0 * Math.PI / 180, k0 = 0.9999, dx = 250000;
      const e = Math.sqrt(1 - (b * b) / (a * a)), e2 = (e * e) / (1 - e * e);
      const M = y97 / k0;
      const mu = M / (a * (1 - e*e/4 - 3*e*e*e*e/64 - 5*e*e*e*e*e*e/256));
      const e1 = (1 - Math.sqrt(1 - e*e)) / (1 + Math.sqrt(1 - e*e));

      const fp = mu + (3*e1/2 - 27*e1*e1*e1/32)*Math.sin(2*mu) + (21*e1*e1/16 - 55*e1*e1*e1*e1/32)*Math.sin(4*mu) + (151*e1*e1*e1/96)*Math.sin(6*mu);
      const C1 = e2 * Math.pow(Math.cos(fp), 2);
      const T1 = Math.pow(Math.tan(fp), 2);
      const R1 = a * (1 - e*e) / Math.pow(1 - e*e * Math.sin(fp)*Math.sin(fp), 1.5);
      const N1 = a / Math.sqrt(1 - e*e * Math.sin(fp)*Math.sin(fp));
      const D = (x97 - dx) / (N1 * k0);

      const latRad = fp - (N1 * Math.tan(fp) / R1) * ((D*D/2) - (5 + 3*T1 + 10*C1 - 4*C1*C1 - 9*e2)*Math.pow(D,4)/24 + (61 + 90*T1 + 298*C1 + 45*T1*T1 - 252*e2 - 3*C1*C1)*Math.pow(D,6)/720);
      const lonRad = lon0 + (D - (1 + 2*T1 + C1)*Math.pow(D,3)/6 + (5 - 2*C1 + 28*T1 - 3*C1*C1 + 8*e2 + 24*T1*T1)*Math.pow(D,5)/120) / Math.cos(fp);

      return { lat: (latRad * 180 / Math.PI).toFixed(6), lng: (lonRad * 180 / Math.PI).toFixed(6) };
    }

    // 2. OCR Worker 初始化 (常駐記憶體，點框時瞬間辨識)
    let worker = null;
    async function initOCR() {
      worker = await Tesseract.createWorker('eng');
      await worker.setParameters({
        tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz '
      });
    }
    initOCR();

    const fileInput = document.getElementById('file-input');
    const statusText = document.getElementById('status');
    const imgContainer = document.getElementById('img-container');
    const displayImg = document.getElementById('display-img');
    const selectBox = document.getElementById('select-box');
    const resultPanel = document.getElementById('result-panel');
    const coordInput = document.getElementById('coord-input');
    const navBtn = document.getElementById('nav-action-btn');
    const geoInfo = document.getElementById('geo-info');

    let isDrawing = false;
    let startX = 0, startY = 0;
    let currentBox = null;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      statusText.innerText = "載入中...";
      resultPanel.style.display = 'none';

      const url = URL.createObjectURL(file);
      displayImg.src = url;
      imgContainer.style.display = 'block';

      displayImg.onload = () => {
        statusText.innerText = "👉 請用手指直接在圖片上「框出要導航的圖號」";
      };
    });

    // 3. 觸控 / 滑鼠拉框事件
    function getPos(e) {
      const rect = imgContainer.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startSelect(e) {
      isDrawing = true;
      const pos = getPos(e);
      startX = pos.x;
      startY = pos.y;
      selectBox.style.left = startX + 'px';
      selectBox.style.top = startY + 'px';
      selectBox.style.width = '0px';
      selectBox.style.height = '0px';
      selectBox.style.display = 'block';
    }

    function moveSelect(e) {
      if (!isDrawing) return;
      const pos = getPos(e);
      const x = Math.min(pos.x, startX);
      const y = Math.min(pos.y, startY);
      const w = Math.abs(pos.x - startX);
      const h = Math.abs(pos.y - startY);

      selectBox.style.left = x + 'px';
      selectBox.style.top = y + 'px';
      selectBox.style.width = w + 'px';
      selectBox.style.height = h + 'px';
      currentBox = { x, y, w, h };
    }

    async function endSelect() {
      if (!isDrawing) return;
      isDrawing = false;
      if (!currentBox || currentBox.w < 15 || currentBox.h < 10) return;

      statusText.innerText = "⚡ 辨識局部圖號中...";
      await recognizeCrop(currentBox);
    }

    imgContainer.addEventListener('mousedown', startSelect);
    window.addEventListener('mousemove', moveSelect);
    window.addEventListener('mouseup', endSelect);

    imgContainer.addEventListener('touchstart', startSelect, { passive: true });
    window.addEventListener('touchmove', moveSelect, { passive: true });
    window.addEventListener('touchend', endSelect);

    // 4. 局部裁切並送 OCR
    async function recognizeCrop(box) {
      const scaleX = displayImg.naturalWidth / displayImg.clientWidth;
      const scaleY = displayImg.naturalHeight / displayImg.clientHeight;

      const cropCanvas = document.createElement('canvas');
      cropCanvas.width = box.w * scaleX;
      cropCanvas.height = box.h * scaleY;
      const ctx = cropCanvas.getContext('2d');

      // 擷取框內局部影像
      ctx.drawImage(
        displayImg,
        box.x * scaleX, box.y * scaleY, box.w * scaleX, box.h * scaleY,
        0, 0, cropCanvas.width, cropCanvas.height
      );

      // 局部增強對比 (二值化)
      const imgData = ctx.getImageData(0, 0, cropCanvas.width, cropCanvas.height);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        const v = gray > 140 ? 255 : 0;
        d[i] = d[i+1] = d[i+2] = v;
      }
      ctx.putImageData(imgData, 0, 0);

      // OCR 辨識
      const ret = await worker.recognize(cropCanvas);
      const rawText = ret.data.text.replace(/[^A-Za-z0-9]/g, '').toUpperCase();

      // 正規表達式匹配台電格式
      const match = rawText.match(/[A-HJ-NP-W][0-9]{4}[A-H][A-E](?:[0-9]{4}|[0-9]{2})/);
      const finalCode = match ? match[0] : rawText;

      statusText.innerText = "✅ 辨識完成！可點擊確認或手動修改";
      coordInput.value = finalCode;
      updateLocation(finalCode);
      resultPanel.style.display = 'block';
    }

    function updateLocation(code) {
      const twd67 = taipowerToTWD67(code);
      if (twd67) {
        const wgs = twd67ToWGS84(twd67[0], twd67[1]);
        geoInfo.innerText = `經緯度: ${wgs.lat}, ${wgs.lng}`;
        navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${wgs.lat},${wgs.lng}`;
        navBtn.style.opacity = '1';
        navBtn.style.pointerEvents = 'auto';
      } else {
        geoInfo.innerText = `❌ 圖號格式不正確，請手動確認`;
        navBtn.style.opacity = '0.4';
        navBtn.style.pointerEvents = 'none';
      }
    }

    coordInput.addEventListener('input', (e) => {
      updateLocation(e.target.value);
    });
  </script>
</body>
</html>
