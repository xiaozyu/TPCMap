<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>⚡ 台電圖號・高清縮放框選導航</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 10px; background: #0f172a; color: #f8fafc; }
    h3 { margin: 0 0 8px 0; font-size: 1.1rem; }
    .upload-card { background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
    input[type="file"] { width: 100%; color: #94a3b8; font-size: 0.9rem; }
    #status { margin-top: 6px; font-weight: bold; font-size: 0.9rem; color: #38bdf8; }

    /* 操作模式工具列 */
    .mode-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #94a3b8;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #60a5fa;
    }

    /* 圖片視窗容器 (支援 Pan & Zoom) */
    .viewport {
      position: relative;
      width: 100%;
      height: 380px;
      background: #020617;
      border-radius: 8px;
      overflow: hidden;
      display: none;
      touch-action: none;
      border: 1px solid #334155;
    }
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }
    #display-img { display: block; pointer-events: none; }

    /* 框選框 */
    #select-box {
      position: absolute;
      border: 2px dashed #facc15;
      background: rgba(250, 204, 21, 0.25);
      display: none;
      pointer-events: none;
    }

    /* 右上角放大鏡 */
    #loupe {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      background: #000;
      overflow: hidden;
      display: none;
      z-index: 99;
      pointer-events: none;
    }
    #loupe-canvas { width: 100%; height: 100%; }

    /* 預覽與導航面板 */
    #preview-container {
      display: none;
      margin-top: 10px;
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .top-action-bar { display: flex; gap: 8px; margin-bottom: 8px; }
    .nav-btn {
      flex: 1;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1.05rem;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .view-toggle-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #64748b;
      padding: 0 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .target-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      color: #facc15;
      font-size: 1.15rem;
      font-family: monospace;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 4px;
    }
    .coords-text { font-size: 0.85rem; color: #94a3b8; margin: 4px 0 8px 0; }
    .map-frame-wrapper {
      width: 100%;
      height: 280px;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      border: 1px solid #475569;
    }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <h3>⚡ 台電圖號・高清放大框選導航</h3>

  <div class="upload-card">
    <input type="file" id="file-input" accept="image/*">
    <div id="status">請上傳報工畫面截圖或照片</div>
  </div>

  <!-- 模式切換鈕 -->
  <div class="mode-bar" id="mode-bar" style="display:none;">
    <button id="btn-mode-pan" class="mode-btn active">🔍 雙指縮放 / 移動</button>
    <button id="btn-mode-crop" class="mode-btn">✏️ 框選小字辨識</button>
  </div>

  <!-- 可無限縮放畫布視窗 -->
  <div class="viewport" id="viewport">
    <div id="stage">
      <img id="display-img">
      <div id="select-box"></div>
    </div>
    <!-- 即時放大鏡 -->
    <div id="loupe"><canvas id="loupe-canvas"></canvas></div>
  </div>

  <!-- 下方地圖與導航預覽 -->
  <div id="preview-container">
    <div class="top-action-bar">
      <a id="nav-btn" class="nav-btn" target="_blank">🚗 開始導航</a>
      <button id="toggle-view-btn" class="view-toggle-btn">切換街景</button>
    </div>
    <input type="text" id="target-input" class="target-input">
    <div id="coords-text" class="coords-text">定位點確認中...</div>
    <div class="map-frame-wrapper">
      <iframe id="map-frame" src="about:blank"></iframe>
    </div>
  </div>

  <script>
    // 1. TWD67 基準點
    const BASE_COORDS = {
      'A': [90000, 2750000],  'B': [170000, 2750000], 'C': [250000, 2750000],
      'D': [90000, 2700000],  'E': [170000, 2700000], 'F': [250000, 2700000],
      'G': [170000, 2650000], 'H': [250000, 2650000],
      'J': [90000, 2600000],  'K': [170000, 2600000], 'L': [250000, 2600000],
      'M': [90000, 2550000],  'N': [170000, 2550000], 'O': [250000, 2550000],
      'P': [90000, 2500000],  'Q': [170000, 2500000], 'R': [250000, 2500000],
      'T': [170000, 2450000], 'U': [250000, 2450000],
      'V': [170000, 2400000], 'W': [250000, 2400000]
    };

    function taipowerToTWD67(code) {
      code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code.length < 9) return null;
      const zone = code[0];
      if (!BASE_COORDS[zone]) return null;
      const [baseX, baseY] = BASE_COORDS[zone];

      const x_800 = parseInt(code.substring(1, 3), 10);
      const y_500 = parseInt(code.substring(3, 5), 10);
      const subX = code[5].charCodeAt(0) - 65;
      const subY = code[6].charCodeAt(0) - 65;

      let offsetX = 0, offsetY = 0;
      if (code.length >= 11) {
        offsetX = parseInt(code.substring(7, 9), 10);
        offsetY = parseInt(code.substring(9, 11), 10);
      } else if (code.length >= 9) {
        offsetX = parseInt(code[7], 10) * 10;
        offsetY = parseInt(code[8], 10) * 10;
      }
      return [baseX + (x_800 * 800) + (subX * 100) + offsetX, baseY + (y_500 * 500) + (subY * 100) + offsetY];
    }

    function twd67ToWGS84(x, y) {
      const A = 0.00001549, B = 0.000006521;
      const x97 = x + 807.8 + A * x + B * y;
      const y97 = y - 248.6 + A * y - B * x;

      const a = 6378137.0, b = 6356752.314245, lon0 = 121.0 * Math.PI / 180, k0 = 0.9999, dx = 250000;
      const e = Math.sqrt(1 - (b * b) / (a * a)), e2 = (e * e) / (1 - e * e);
      const M = y97 / k0;
      const mu = M / (a * (1 - e*e/4 - 3*e*e*e*e/64 - 5*e*e*e*e*e*e/256));
      const e1 = (1 - Math.sqrt(1 - e*e)) / (1 + Math.sqrt(1 - e*e));

      const fp = mu + (3*e1/2 - 27*e1*e1*e1/32)*Math.sin(2*mu) + (21*e1*e1/16 - 55*e1*e1*e1*e1/32)*Math.sin(4*mu) + (151*e1*e1*e1/96)*Math.sin(6*mu);
      const C1 = e2 * Math.pow(Math.cos(fp), 2);
      const T1 = Math.pow(Math.tan(fp), 2);
      const R1 = a * (1 - e*e) / Math.pow(1 - e*e * Math.sin(fp)*Math.sin(fp), 1.5);
      const N1 = a / Math.sqrt(1 - e*e * Math.sin(fp)*Math.sin(fp));
      const D = (x97 - dx) / (N1 * k0);

      const latRad = fp - (N1 * Math.tan(fp) / R1) * ((D*D/2) - (5 + 3*T1 + 10*C1 - 4*C1*C1 - 9*e2)*Math.pow(D,4)/24 + (61 + 90*T1 + 298*C1 + 45*T1*T1 - 252*e2 - 3*C1*C1)*Math.pow(D,6)/720);
      const lonRad = lon0 + (D - (1 + 2*T1 + C1)*Math.pow(D,3)/6 + (5 - 2*C1 + 28*T1 - 3*C1*C1 + 8*e2 + 24*T1*T1)*Math.pow(D,5)/120) / Math.cos(fp);

      return { lat: (latRad * 180 / Math.PI).toFixed(6), lng: (lonRad * 180 / Math.PI).toFixed(6) };
    }

    let worker = null;
    async function initOCR() {
      worker = await Tesseract.createWorker(['chi_tra', 'eng']);
    }
    initOCR();

    // DOM 元素
    const fileInput = document.getElementById('file-input');
    const statusText = document.getElementById('status');
    const modeBar = document.getElementById('mode-bar');
    const btnModePan = document.getElementById('btn-mode-pan');
    const btnModeCrop = document.getElementById('btn-mode-crop');
    const viewport = document.getElementById('viewport');
    const stage = document.getElementById('stage');
    const displayImg = document.getElementById('display-img');
    const selectBox = document.getElementById('select-box');
    const loupe = document.getElementById('loupe');
    const loupeCanvas = document.getElementById('loupe-canvas');
    const loupeCtx = loupeCanvas.getContext('2d');

    const previewContainer = document.getElementById('preview-container');
    const targetInput = document.getElementById('target-input');
    const navBtn = document.getElementById('nav-btn');
    const coordsText = document.getElementById('coords-text');
    const mapFrame = document.getElementById('map-frame');
    const toggleViewBtn = document.getElementById('toggle-view-btn');

    // 縮放與平移狀態
    let scale = 1, panX = 0, panY = 0;
    let mode = 'pan'; // 'pan' 或 'crop'
    let currentLat = null, currentLng = null;
    let isStreetView = false;

    // 模式切換
    btnModePan.onclick = () => {
      mode = 'pan';
      btnModePan.classList.add('active');
      btnModeCrop.classList.remove('active');
      statusText.innerText = "🔍 模式：單指滑動移動、雙指縮放畫面";
    };
    btnModeCrop.onclick = () => {
      mode = 'crop';
      btnModeCrop.classList.add('active');
      btnModePan.classList.remove('active');
      statusText.innerText = "✏️ 模式：直接用手指框選要辨識的小字";
    };

    function updateTransform() {
      stage.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      statusText.innerText = "載入高解析度圖片中...";
      previewContainer.style.display = 'none';

      const url = URL.createObjectURL(file);
      displayImg.src = url;

      displayImg.onload = () => {
        viewport.style.display = 'block';
        modeBar.style.display = 'flex';
        // 初始自適應寬度
        scale = viewport.clientWidth / displayImg.naturalWidth;
        panX = 0;
        panY = 0;
        updateTransform();
        btnModePan.click();
      };
    });

    // 手勢處理 (支援單指拖動/框選、雙指 Pinch 縮放)
    let isTouching = false;
    let startTouches = [];
    let startPanX = 0, startPanY = 0, startScale = 1;
    let cropStart = { x: 0, y: 0 };
    let cropCurrent = { x: 0, y: 0 };

    function getTouchDist(t1, t2) {
      return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }
    function getTouchCenter(t1, t2) {
      return { x: (t1.clientX + t2.clientX)/2, y: (t1.clientY + t2.clientY)/2 };
    }

    viewport.addEventListener('touchstart', (e) => {
      isTouching = true;
      if (e.touches.length === 2) {
        // 雙指一律強制作為縮放
        startTouches = [e.touches[0], e.touches[1]];
        startScale = scale;
        startPanX = panX;
        startPanY = panY;
      } else if (e.touches.length === 1) {
        const t = e.touches[0];
        const vRect = viewport.getBoundingClientRect();
        const stageX = (t.clientX - vRect.left - panX) / scale;
        const stageY = (t.clientY - vRect.top - panY) / scale;

        if (mode === 'pan') {
          startTouches = [t];
          startPanX = panX;
          startPanY = panY;
        } else {
          // 框選模式
          cropStart = { x: stageX, y: stageY };
          cropCurrent = { ...cropStart };
          selectBox.style.left = stageX + 'px';
          selectBox.style.top = stageY + 'px';
          selectBox.style.width = '0px';
          selectBox.style.height = '0px';
          selectBox.style.display = 'block';
          loupe.style.display = 'block';
          renderLoupe(stageX, stageY);
        }
      }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
      if (!isTouching) return;
      e.preventDefault();

      if (e.touches.length === 2) {
        // 雙指 Pinch 縮放
        const dist = getTouchDist(e.touches[0], e.touches[1]);
        const startDist = getTouchDist(startTouches[0], startTouches[1]);
        const factor = dist / startDist;
        scale = Math.min(Math.max(startScale * factor, 0.2), 6.0); // 最高支援放大 6 倍看小字
        updateTransform();
      } else if (e.touches.length === 1) {
        const t = e.touches[0];
        const vRect = viewport.getBoundingClientRect();

        if (mode === 'pan') {
          panX = startPanX + (t.clientX - startTouches[0].clientX);
          panY = startPanY + (t.clientY - startTouches[0].clientY);
          updateTransform();
        } else {
          // 框選模式
          const stageX = (t.clientX - vRect.left - panX) / scale;
          const stageY = (t.clientY - vRect.top - panY) / scale;
          cropCurrent = { x: stageX, y: stageY };

          const x = Math.min(cropStart.x, cropCurrent.x);
          const y = Math.min(cropStart.y, cropCurrent.y);
          const w = Math.abs(cropStart.x - cropCurrent.x);
          const h = Math.abs(cropStart.y - cropCurrent.y);

          selectBox.style.left = x + 'px';
          selectBox.style.top = y + 'px';
          selectBox.style.width = w + 'px';
          selectBox.style.height = h + 'px';

          renderLoupe(stageX, stageY);
        }
      }
    }, { passive: false });

    viewport.addEventListener('touchend', async () => {
      if (!isTouching) return;
      isTouching = false;
      loupe.style.display = 'none';

      if (mode === 'crop') {
        const x = Math.min(cropStart.x, cropCurrent.x);
        const y = Math.min(cropStart.y, cropCurrent.y);
        const w = Math.abs(cropStart.x - cropCurrent.x);
        const h = Math.abs(cropStart.y - cropCurrent.y);

        if (w > 12 && h > 8) {
          statusText.innerText = "⚡ 高清無損裁切辨識中...";
          await processNativeCrop(x, y, w, h);
        }
      }
    });

    // 右上角即時放大鏡渲染
    function renderLoupe(cx, cy) {
      loupeCanvas.width = 110;
      loupeCanvas.height = 110;
      const zoom = 2.5; // 放大 2.5 倍
      const cropW = 110 / zoom;
      const cropH = 110 / zoom;
      loupeCtx.drawImage(
        displayImg,
        cx - cropW/2, cy - cropH/2, cropW, cropH,
        0, 0, 110, 110
      );
      // 十字中心準心
      loupeCtx.strokeStyle = '#38bdf8';
      loupeCtx.lineWidth = 1.5;
      loupeCtx.beginPath();
      loupeCtx.moveTo(55, 45); loupeCtx.lineTo(55, 65);
      loupeCtx.moveTo(45, 55); loupeCtx.lineTo(65, 55);
      loupeCtx.stroke();
    }

    // 從相機原始高解析度無損裁切
    async function processNativeCrop(sx, sy, sw, sh) {
      const cropCanvas = document.createElement('canvas');
      // 將小框尺寸無損放大（最少 300px 寬），保證 OCR 準確度
      const targetW = Math.max(sw * 2, 400);
      const targetH = (sh / sw) * targetW;

      cropCanvas.width = targetW;
      cropCanvas.height = targetH;
      const ctx = cropCanvas.getContext('2d');

      // 從原圖座標裁切
      ctx.drawImage(displayImg, sx, sy, sw, sh, 0, 0, targetW, targetH);

      // 二值化增強
      const imgData = ctx.getImageData(0, 0, targetW, targetH);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        const v = gray > 145 ? 255 : 0;
        d[i] = d[i+1] = d[i+2] = v;
      }
      ctx.putImageData(imgData, 0, 0);

      const ret = await worker.recognize(cropCanvas);
      let text = ret.data.text.trim().replace(/\r?\n/g, '');

      // 檢查是否符合台電格式
      const clean = text.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
      const coordMatch = clean.match(/[A-HJ-NP-W][0-9]{4}[A-H][A-E](?:[0-9]{4}|[0-9]{2})/);
      if (coordMatch) {
        text = coordMatch[0];
      }

      targetInput.value = text;
      statusText.innerText = "✅ 辨識完成！下方可預覽目的地與街景";
      processTarget(text);
      previewContainer.style.display = 'block';
    }

    function processTarget(val) {
      isStreetView = false;
      toggleViewBtn.innerText = "切換街景";

      const cleanCode = val.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
      const twd67 = taipowerToTWD67(cleanCode);

      if (twd67) {
        const wgs = twd67ToWGS84(twd67[0], twd67[1]);
        currentLat = wgs.lat;
        currentLng = wgs.lng;
        coordsText.innerText = `台電座標 WGS84: ${currentLat}, ${currentLng}`;
        navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${currentLat},${currentLng}`;
        updateMapFrame();
      } else {
        currentLat = null;
        currentLng = null;
        coordsText.innerText = `門牌地址模式: ${val}`;
        navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(val)}`;
        mapFrame.src = `https://maps.google.com/maps?q=${encodeURIComponent(val)}&t=&z=17&ie=UTF8&iwloc=&output=embed`;
      }
    }

    function updateMapFrame() {
      if (!currentLat || !currentLng) return;
      if (isStreetView) {
        mapFrame.src = `https://maps.google.com/maps?q=&layer=c&cbll=${currentLat},${currentLng}&cbp=11,0,0,0,0&output=svembed`;
      } else {
        mapFrame.src = `https://maps.google.com/maps?q=${currentLat},${currentLng}&hl=zh-TW&z=18&output=embed`;
      }
    }

    toggleViewBtn.addEventListener('click', () => {
      if (!currentLat || !currentLng) {
        alert("一般地址模式無法直接切換點對點街景，請使用圖號！");
        return;
      }
      isStreetView = !isStreetView;
      toggleViewBtn.innerText = isStreetView ? "切換地圖" : "切換街景";
      updateMapFrame();
    });

    targetInput.addEventListener('change', (e) => {
      processTarget(e.target.value);
    });
  </script>
</body>
</html>
