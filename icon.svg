<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 背景圓角矩形 -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="512" height="512" rx="110" fill="none" stroke="#38bdf8" stroke-width="12" stroke-opacity="0.4"/>

  <!-- 科技定位網格與圓環 -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="120" fill="#0b0f19" fill-opacity="0.6"/>

  <!-- 地圖定位水滴 Pin (帶投影) -->
  <path d="M256 90 C180 90, 125 145, 125 220 C125 310, 256 425, 256 425 C256 425, 387 310, 387 220 C387 145, 332 90, 256 90 Z" fill="#0284c7" filter="url(#shadow)"/>
  <circle cx="256" cy="215" r="75" fill="#0f172a"/>

  <!-- 核心電力閃電標誌 -->
  <polygon points="270,140 195,235 245,235 230,300 315,195 265,195" fill="url(#bolt)"/>
</svg>
